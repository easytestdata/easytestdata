version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
    open-pull-requests-limit: 10
    ignore:
      # jsdom 30 needs Node 22.22.2+, but the published packages support Node 22.13+ (the root
      # package.json pins jsdom below 30 too). Remove this when the Node minimum is raised.
      - dependency-name: "jsdom"
        versions: [">=30.0.0"]
    labels:
      - "dependencies"
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
