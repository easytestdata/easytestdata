name: Dependency audit

# Runs on a schedule and when dependencies change, so a newly published advisory doesn't
# fail unrelated contributor pull requests.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "**/package.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level=high
